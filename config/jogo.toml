# Configurações gerais do jogo.
[janela]
titulo = "Angel and Dark"
largura = 960
altura = 540
fps = 60

[cores]
# Cores provisórias (R, G, B) até a arte entrar.
fundo = [24, 28, 48]
plataforma = [92, 98, 120]
texto = [220, 220, 230]
texto_fase = [255, 255, 255]     # texto em cima do cenário colorido
caixa = [24, 28, 48]             # fundo escuro atrás do texto, para ler bem
perigo = [220, 70, 70]           # espinhos nas fases de teste (sem arte)
destaque = [255, 210, 90]        # moldura do personagem selecionado e bandeira

[camera]
suavidade_x = 6.0                # maior = acompanha mais rápido na horizontal
suavidade_y = 4.0                # maior = sobe mais rápido
suavidade_descida = 9.0          # maior = desce mais rápido (cair pede mais urgência)
olhar_frente = 120               # pixels a mais mostrados para o lado em que o personagem anda
altura_personagem = 0.70         # onde ficam os pés na tela (0 = topo, 1 = base)
margem_topo = 0.15               # se o personagem passar disto para cima, a câmera sobe
margem_base = 0.85               # se passar disto para baixo, a câmera desce

[mapa]
escala = 2                       # blocos de 18 px do Tiled viram 36 px na tela
fase_inicial = "01_floresta"

[hud]
imagem = "assets/cenarios/01_floresta/kenney_tiles.png"
tamanho_bloco = 18
escala = 2
coracao_cheio = 44               # blocos da folha da Kenney
coracao_vazio = 46
